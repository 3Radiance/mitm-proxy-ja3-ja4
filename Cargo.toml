[package]
name = "mitm-proxy-ja3-ja4"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
httparse = "1.8"
rcgen = "0.13"
btls = "0.5"
time = "0.3"
tokio-btls = "0.5"
dashmap = "6.0"
clap = { version = "4", features = ["derive"] }
http2 = { version = "0.5.2", features = ["unstable"] }
chromium-roots = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
brotli = "9"
flate2 = "1"
zstd = "0.14"
bytes = "1"
http = "1.5.0"